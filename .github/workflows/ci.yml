# Runs on every push and pull request. Nothing here needs a database or an
# Azure credential: the API tests replace the two database helpers with a fake,
# so the suite is fast and cannot be broken by the serverless database being
# asleep.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        # The slim runtime set, plus the two packages the tests themselves need.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run tests
        run: pytest

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        # `npm run build` is tsc followed by vite, so a type error fails here
        # rather than in production.
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No credential files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|local\.settings\.json$'; then
            echo "::error::a credential file is tracked in git"
            exit 1
          fi

      - name: No secrets in the tracked source
        # Catches the shapes that actually leak: an assigned password or key, a
        # connection string, a storage account key.
        run: |
          if git grep -inE "(password|api[_-]?key|secret|token) *= *[\"'][^\"'\$]{6,}|connectionstring *=|AccountKey[=]" \
             -- . ':(exclude)scripts/safe-commit.sh' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::possible secret committed, see the match above"
            exit 1
          fi
